[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outline-iou-analyzer"
version = "0.1.0"
description = "Analyze IoU between convex hull outlines from two point sets."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "outline-iou-analyzer contributors" }
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "shapely>=2.0",
  "matplotlib>=3.6",
  "pandas>=1.5",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/akh1r0ck/outline-iou-analyzer"
Repository = "https://github.com/akh1r0ck/outline-iou-analyzer"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
